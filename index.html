<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Timer Ultimate OBS</title>
<style>
  body {
    background: #111;
    color: #eee;
    margin: 0;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .timer {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    align-items: center;
  }

  .digit {
    width: 64px;
    height: 100px;
    background-size: contain;
    background-repeat: no-repeat;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
  }

  .add-time {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  input[type="number"], select {
    padding: 8px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #555;
    background-color: #222;
    color: #eee;
  }

  button {
    padding: 10px 15px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background-color: #333;
    color: #eee;
    transition: 0.3s;
  }

  button:hover {
    background-color: #555;
  }

  .status-image {
    width: 200px;
    height: auto;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="timer" id="timerDisplay"></div>

  <div class="add-time">
    <input type="number" id="timeValue" placeholder="Valeur" min="1">
    <select id="timeUnit">
      <option value="s">Secondes</option>
      <option value="m">Minutes</option>
      <option value="h">Heures</option>
    </select>
    <button onclick="addCustomTime()">+ Ajouter</button>
    <button onclick="removeCustomTime()">− Retirer</button>
  </div>

  <div class="controls">
    <button onclick="startTimer()">▶️ Démarrer</button>
    <button onclick="pauseTimer()">⏸️ Pause</button>
    <button onclick="resetTimer()">🔁 Réinitialiser</button>
  </div>

  <img id="statusImage" class="status-image" style="display:none" />

  <audio id="alarmSound" src="alarm.mp3" preload="auto"></audio>

  <script>
    let totalSeconds = 0;
    let isRunning = false;
    let interval = null;

    const display = document.getElementById("timerDisplay");
    const statusImg = document.getElementById("statusImage");
    const alarmSound = document.getElementById("alarmSound");

    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return [
        String(hrs).padStart(2, '0'),
        String(mins).padStart(2, '0'),
        String(secs).padStart(2, '0')
      ];
    }

    function updateDisplay() {
      const [hrs, mins, secs] = formatTime(totalSeconds);
      display.innerHTML = "";

      const timeStr = hrs + ":" + mins + ":" + secs;
      for (let char of timeStr) {
        const el = document.createElement("div");
        el.classList.add("digit");
        if (char === ":") {
          el.style.backgroundImage = "url(colon.png)";
        } else {
          el.style.backgroundImage = `url(${char}.png)`;
        }
        display.appendChild(el);
      }
    }

    function startTimer() {
      if (!isRunning && totalSeconds > 0) {
        isRunning = true;
        statusImg.style.display = "none";
        interval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            pauseTimer();
            showEnd();
          }
        }, 1000);
      }
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(interval);
      showPause();
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = 0;
      updateDisplay();
      statusImg.style.display = "none";
    }

    function addCustomTime() {
      const value = parseInt(document.getElementById("timeValue").value);
      const unit = document.getElementById("timeUnit").value;

      if (isNaN(value) || value <= 0) return;

      let secondsToAdd = 0;
      if (unit === "s") secondsToAdd = value;
      if (unit === "m") secondsToAdd = value * 60;
      if (unit === "h") secondsToAdd = value * 3600;

      totalSeconds += secondsToAdd;
      updateDisplay();
    }

    function removeCustomTime() {
      const value = parseInt(document.getElementById("timeValue").value);
      const unit = document.getElementById("timeUnit").value;

      if (isNaN(value) || value <= 0) return;

      let secondsToRemove = 0;
      if (unit === "s") secondsToRemove = value;
      if (unit === "m") secondsToRemove = value * 60;
      if (unit === "h") secondsToRemove = value * 3600;

      totalSeconds = Math.max(0, totalSeconds - secondsToRemove);
      updateDisplay();
    }

    function showPause() {
      statusImg.src = "pause.png";
      statusImg.style.display = "block";
    }

    function showEnd() {
      statusImg.src = "end.png";
      statusImg.style.display = "block";
      try {
        alarmSound.play();
      } catch (e) {
        console.warn("Pas de son déclenché :", e);
      }
    }

    updateDisplay();
  </script>
</body>
</html>
